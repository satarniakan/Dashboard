name: Build and Test

# هر بار push به master/main یا هر Pull Request که به این شاخه‌ها باز می‌شود، این workflow اجرا می‌شود
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # TestDatabaseFixture از این متغیر برای اتصال به SQL Server استفاده می‌کند؛
      # بدون آن، تست‌های یکپارچگی به‌جای شکست Skip می‌شوند.
      TEST_MSSQL_CONNECTION: "Server=localhost,1433;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true"

    steps:
      - name: Checkout کد
        uses: actions/checkout@v4

      - name: نصب .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore پکیج‌ها
        run: dotnet restore Dashboard.slnx

      - name: Build
        run: dotnet build Dashboard.slnx --no-restore --configuration Release

      # سلامت SQL Server پیش از تست: اگر سرویس بالا نیاید، تست‌های یکپارچگی
      # طبق طراحیِ TestDatabaseFixture «Skip» می‌شوند و build سبز می‌ماند — یعنی
      # CI عملاً هیچ تستی اجرا نکرده ولی موفق گزارش می‌شود. این مرحله جلوی
      # «تست سبزِ توهمی» را می‌گیرد و اجازه نمی‌دهد سرویس خراب بی‌سروصدا رد شود.
      - name: بررسی سلامت SQL Server
        run: |
          for i in $(seq 1 12); do
            if /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -C -Q 'SELECT 1' >/dev/null 2>&1; then
              echo "SQL Server آماده است (تلاش $i)"
              exit 0
            fi
            echo "در انتظار SQL Server… ($i/12)"
            sleep 10
          done
          echo "::error::SQL Server بالا نیامد؛ تست‌های یکپارچگی اجرا نمی‌شوند."
          exit 1

      # ⚠️ این مرحله تست‌ها را یک‌بار اجرا می‌کند و خروجی را در فایل ذخیره می‌کند.
      # نگهبانِ پایینی همان فایل را می‌خواند — پس تست‌ها دو بار اجرا نمی‌شوند.
      # قبلاً این کار دو بار انجام می‌شد که با ~۱۵۵ تستِ یکپارچگی، زمان CI را
      # تقریباً دو برابر می‌کرد.
      - name: اجرای تست‌ها
        run: |
          set -o pipefail
          dotnet test Dashboard.slnx --no-build --configuration Release --verbosity normal \
            2>&1 | tee test-output.txt

      # تضمین نهایی: اگر تستی Skipped شده باشد، عمداً خطا می‌دهیم تا «تست سبزِ
      # توهمی» پایان نوشته به CI گزارش نشود. برای اجازه‌دادن به Skip،
      # متغیر ALLOW_SKIPPED_TESTS=true را ست کنید.
      - name: اطمینان از اجرا شدن تست‌ها (نه Skip)
        if: env.ALLOW_SKIPPED_TESTS != 'true'
        run: |
          if grep -qE 'Skipped:\s+[1-9][0-9]*' test-output.txt; then
            echo "::error::تعدادی تست Skip شده است — یعنی بخشی از تست‌ها اجرا نشده‌اند."
            exit 1
          fi
          echo "همهٔ تست‌ها اجرا شدند (بدون Skip)."
