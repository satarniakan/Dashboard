<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>آفلاین — فروشگاه من</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: #f8f9fb;
            color: #1f2937;
            text-align: center;
        }
        .box { max-width: 22rem; padding: 1.5rem; }
        .icon { font-size: 3rem; margin-bottom: 0.75rem; }
        h1 { font-size: 1.15rem; margin: 0 0 0.5rem; }
        p { color: #6b7280; font-size: 0.9rem; line-height: 1.8; margin: 0 0 1.25rem; }
        button {
            font-family: inherit;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.6rem 1.5rem;
            font-size: 0.95rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon" aria-hidden="true">📡</div>
        <h1>اتصال اینترنت برقرار نیست</h1>
        <p>برای مشاهده‌ی فروشگاه باید دوباره آنلاین شوید. پس از برقراری اتصال، این صفحه را تازه‌سازی کنید.</p>
        <button onclick="location.reload()">تلاش دوباره</button>
    </div>
</body>
</html>
